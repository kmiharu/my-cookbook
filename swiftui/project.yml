name: SwiftUICatalog
options:
  deploymentTarget:
    iOS: "27.2"
  developmentLanguage: ja
packages:
  CatalogCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CATALOG_SOURCE_REVISION: local
targets:
  SwiftUICatalog:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
          - "Info.plist"
    dependencies:
      - package: CatalogCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cookbook.swiftui
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SwiftUICatalog:
    build:
      targets:
        SwiftUICatalog: all
