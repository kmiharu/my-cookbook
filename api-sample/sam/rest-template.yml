AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Local REST API payload v1 example
Resources:
  RestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: java21
      Architectures: [x86_64]
      CodeUri: ../app/build/distributions/api-lambda.zip
      Handler: io.micronaut.function.aws.proxy.payload1.ApiGatewayProxyRequestEventFunction
      Timeout: 90
      MemorySize: 1024
      Environment:
        Variables:
          APP_RUNTIME: local
          APP_ROLE: api
          DATABASE_TYPE: dynamodb
          DYNAMODB_ENDPOINT: http://dynamodb:8000
          DYNAMODB_TABLE: products
          PG_JDBC_URL: jdbc:postgresql://postgres:5432/products
          PG_USER: products
          PG_PASSWORD: products
          PG_POOL_SIZE: "4"
          AWS_EC2_METADATA_DISABLED: "true"
          NO_PROXY: localhost,127.0.0.1,dynamodb,postgres
          no_proxy: localhost,127.0.0.1,dynamodb,postgres
      Events:
        Root:
          Type: Api
          Properties:
            Path: /products
            Method: ANY
        Product:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: ANY
