plugins {
    id 'io.micronaut.application' version '4.6.2'
    id 'org.graalvm.buildtools.native' version '0.11.2'
}

group = 'cookbook'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'cookbook.api.Application'
}

micronaut {
    version '4.10.25'
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'cookbook.api.*'
    }
}

dependencies {
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor 'io.micronaut.validation:micronaut-validation-processor'

    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut.validation:micronaut-validation'
    implementation 'io.micronaut.aws:micronaut-function-aws-api-proxy'
    implementation platform('software.amazon.awssdk:bom:2.31.66')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:secretsmanager'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'org.mybatis:mybatis:3.5.19'
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'org.flywaydb:flyway-core:11.20.3'
    implementation 'org.flywaydb:flyway-database-postgresql:11.20.3'

    runtimeOnly 'ch.qos.logback:logback-classic'

    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('../openapi/products.yaml') {
        into 'META-INF/swagger'
    }
}

tasks.register('lambdaZip', Zip) {
    archiveFileName = 'api-lambda.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into('lib') {
        from tasks.named('jar')
        from configurations.runtimeClasspath
    }
    from 'src/main/lambda'
}

graalvmNative {
    toolchainDetection = false
    binaries {
        main {
            imageName = 'products-api'
            buildArgs.add('-H:+ReportExceptionStackTraces')
        }
    }
}
