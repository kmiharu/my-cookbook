name: SwiftUI Simulator verification

on:
  push:
    paths:
      - swiftui/App/**
      - swiftui/Core/**
      - swiftui/checks/**
      - swiftui/project.yml
      - swiftui/ci/ios.sh
      - .github/workflows/swiftui-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Swift package and build iOS Simulator app
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
          CATALOG_SIMULATOR_SMOKE: "1"
          CATALOG_UNSIGNED_ARCHIVE: "1"
        run: bash swiftui/ci/ios.sh verify
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swiftui-simulator-xcresult
          path: |
            swiftui/build/verify/simulator.xcresult.zip
            swiftui/build/verify/catalog-launch.png
          if-no-files-found: ignore
          retention-days: 7
