name: Spring Batch examples

on:
  pull_request:
    paths:
      - spring-batch-examples/**
      - .github/workflows/spring-batch-examples.yml
  push:
    paths:
      - spring-batch-examples/**
      - .github/workflows/spring-batch-examples.yml

permissions:
  contents: read

jobs:
  spring-batch-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: spring-batch-examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./scripts/setup-local.sh
      - run: ./gradlew --no-daemon clean check :batch-examples:bootJar
        env:
          BATCH_S3_TEST_ENDPOINT: http://127.0.0.1:18333
          BATCH_TEST_DYNAMO_ENDPOINT: http://127.0.0.1:18000
      - run: ./scripts/verify-local.sh
      - run: ./scripts/verify-restart-s3.sh
      - run: ./scripts/verify-run-ownership.sh
      - run: ./scripts/verify-stop-local.sh
      - run: ./scripts/verify-chunk-recovery.sh
      - run: ./scripts/verify-restart-dynamodb.sh
      - run: ./scripts/verify-standard-scenarios.sh
      - run: ./scripts/operations-scenarios.sh
      - run: ./scripts/dynamodb-scenarios.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-batch-local-failure-${{ github.run_id }}
          path: |
            spring-batch-examples/**/build/test-results/
            spring-batch-examples/bench-results/raw/
      - if: always()
        run: docker compose --profile tools --profile batch down --remove-orphans

  spring-batch-terraform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spring-batch-examples
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - run: ./infra/terraform/verify.sh
